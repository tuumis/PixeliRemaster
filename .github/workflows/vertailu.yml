name: Vertailukuvat (Katso heti -parannukset)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kirjastot
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q numpy pillow
          python -m pip install --disable-pip-version-check -q torch --index-url https://download.pytorch.org/whl/cpu
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Vertailukuvat
        shell: pwsh
        env:
          PIXELI_GH_TOKEN: ${{ github.token }}
        run: python installer/vertailukuvat.py vertailu
      - name: Lataa luonnosjulkaisuun
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vertailu-${{ github.run_id }}"
          gh release create $tag --repo ${{ github.repository }} --draft --title $tag --notes "Väliaikaiset vertailukuvat" (Get-ChildItem vertailu\vertailu_*.png).FullName
