name: Rakenna asennusohjelma

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      julkaise:
        description: "Julkaise versio Releases-sivulle (tagi v<VERSIO>)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Testi-DVD (VIDEO_TS) DVD-levyn omaa lukua ja kopiointia varten: dvdauthor on vain Linuxissa
  testilevy:
    runs-on: ubuntu-latest
    steps:
      - name: Tee testi-DVD (3 nimikettä, 2 äänikieltä, luvut)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q dvdauthor ffmpeg
          mkdir -p levy && cd levy
          for x in "a 150" "b 125" "c 20"; do
            set -- $x
            ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=720x576:r=25:d=$2" -f lavfi -i "sine=f=440:d=$2" \
              -f lavfi -i "sine=f=660:d=$2" -map 0 -map 1 -map 2 -target pal-dvd -aspect 16:9 -b:v 500k \
              -c:a ac3 -b:a 96k -ar 48000 -ac 2 "$1.mpg"
          done
          cat > dvd.xml <<'XML'
          <dvdauthor dest="testilevy">
            <vmgm />
            <titleset>
              <titles>
                <video format="pal" aspect="16:9" />
                <audio lang="fi" />
                <audio lang="en" />
                <pgc><vob file="a.mpg" chapters="0,0:50,1:40" /></pgc>
                <pgc><vob file="b.mpg" /></pgc>
                <pgc><vob file="c.mpg" /></pgc>
              </titles>
            </titleset>
          </dvdauthor>
          XML
          VIDEO_FORMAT=PAL dvdauthor -x dvd.xml
          ls -la testilevy/VIDEO_TS
      - uses: actions/upload-artifact@v4
        with:
          name: testilevy
          path: levy/testilevy
          retention-days: 3

  windows:
    runs-on: windows-latest
    needs: testilevy
    steps:
      - uses: actions/checkout@v4

      - name: Kokoa Python-ympäristö ja sovellus
        shell: pwsh
        run: ./installer/rakenna.ps1

      - name: Savutesti
        shell: pwsh
        run: ./build/python/python.exe installer/savutesti.py

      # PyTorch-polku (prosessorilla) ja kuvien käsittely Windowsissa; erillinen Python,
      # joten asennuspakettiin ei tule mitään ylimääräistä
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyTorch- ja kuvatesti
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow pillow-heif torch torchvision --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install --disable-pip-version-check -q facexlib opencv-python-headless
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          # määrittelemättömät nimet (esim. näytönohjainta vaativissa poluissa, joita testit eivät aja)
          python -m pip install --disable-pip-version-check -q pyflakes
          $nimet = python -m pyflakes app installer 2>&1 | Select-String "undefined name"
          if ($nimet) { $nimet | ForEach-Object { Write-Host "::error title=pyflakes::$_" }; throw "määrittelemätön nimi" }
          python installer/torchtesti.py
          if ($LASTEXITCODE -ne 0) { throw "torchtesti epäonnistui" }

      - name: Rakenna Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DVersio=$env:VERSIO" installer/pixeliremaster.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC epäonnistui" }
          Get-ChildItem dist

      - name: Soitintesti (mpv:n lataus, 7z-purku ja komennot Windowsissa)
        shell: pwsh
        env:
          PIXELI_GH_TOKEN: ${{ github.token }}
        run: |
          $data = Join-Path $env:RUNNER_TEMP "pixeli_soitin"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:PIXELI_DATA = $data
          $env:PIXELI_LAITE = "numpy"
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=s=720x576:r=25:d=4 -f lavfi -i sine=d=4 -c:v mpeg2video -aspect 16:9 -c:a ac3 -shortest "$data\alkup.mkv"
          ffmpeg -loglevel error -y -i "$data\alkup.mkv" -vf "scale=1280:720,setsar=1" -c:v libx265 -pix_fmt yuv420p10le -preset ultrafast -c:a copy "$data\remaster.mkv"
          ./build/python/python.exe installer/soitintesti.py $data
          if ($LASTEXITCODE -ne 0) { throw "soitintesti epäonnistui" }

      - uses: actions/download-artifact@v4
        with:
          name: testilevy
          path: ${{ runner.temp }}/testilevy

      - name: DVD:n luku ja kopiointi ilman MakeMKV:tä
        shell: pwsh
        env:
          PIXELI_GH_TOKEN: ${{ github.token }}
        run: |
          $env:PIXELI_DATA = Join-Path $env:RUNNER_TEMP "pixeli_soitin"
          $env:PIXELI_LAITE = "numpy"
          ./build/python/python.exe installer/levytesti.py (Join-Path $env:RUNNER_TEMP "testilevy") (Join-Path $env:RUNNER_TEMP "levykopio")
          if ($LASTEXITCODE -ne 0) { throw "levytesti epäonnistui" }

      - name: Tekstitysten tunnistus (Windowsin OCR)
        shell: pwsh
        run: |
          ./build/python/python.exe installer/ocrtesti.py
          if ($LASTEXITCODE -ne 0) { throw "ocrtesti epäonnistui" }

      - name: Päivitystesti (ohjelman sisäinen päivitys edellisestä julkaisusta)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) edellinen julkaistu versio asennetaan kuten käyttäjällä
          gh release download --repo ${{ github.repository }} --pattern "*-Setup.exe" --dir vanha
          $vanha = Get-ChildItem vanha\*-Setup.exe | Select-Object -First 1
          Start-Process $vanha.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $koti = "$env:LOCALAPPDATA\Programs\PixeliRemaster"
          if (-not (Test-Path "$koti\app\kaynnista.py")) { throw "vanhan version asennus epäonnistui" }
          # 2) sovelluksen oma päivityskoodi: apuprosessi odottaa ohjelman sulkeutumista ja asentaa hiljaisena
          $uusi = (Get-ChildItem dist\*-Setup.exe | Select-Object -First 1).FullName
          $data = Join-Path $env:RUNNER_TEMP "pixeli_paivitys"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:PIXELI_DATA = $data
          $env:PIXELI_LAITE = "numpy"
          $env:PIXELI_IKKUNA = "selain"
          ./build/python/python.exe -c "import sys; sys.path.insert(0, 'build/app'); from pathlib import Path; from pixeli import paivitys; (Path(sys.argv[2]) / 'paivitys').mkdir(parents=True, exist_ok=True); paivitys._apuprosessi(Path(sys.argv[1]))" $uusi $data
          # 3) uusi versio asentuu ja käynnistyy itsestään (instanssi.json kirjoitetaan, kun palvelin vastaa)
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path "$data\instanssi.json") -and (Select-String -Path "$koti\app\pixeli\moottori.py" -Pattern "VERSIO = `"$env:VERSIO`"" -Quiet)) { $ok = $true; break }
          }
          Get-Content "$data\paivitys\asennus.log" -ErrorAction SilentlyContinue | Select-Object -Last 15
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*kaynnista.py*" } | ForEach-Object { Write-Host "käynnissä: $($_.ProcessId) $($_.CommandLine)"; Stop-Process -Id $_.ProcessId -Force }
          if (-not $ok) { throw "päivitys ei asentunut tai uusi versio ei käynnistynyt" }
          Write-Host "::notice title=paivitystesti::$($vanha.Name) -> $env:VERSIO asentui ja käynnistyi itsestään"

      - uses: actions/upload-artifact@v4
        with:
          name: PixeliRemaster-${{ env.VERSIO }}-Setup
          path: dist/*.exe

      - name: Julkaise
        if: startsWith(github.ref, 'refs/tags/v') || inputs.julkaise
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIO }}
          target_commitish: ${{ github.sha }}
          name: PixeliRemaster ${{ env.VERSIO }}
          make_latest: true
          files: dist/*.exe
          body_path: installer/julkaisutiedot.md
