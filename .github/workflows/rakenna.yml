name: Rakenna asennusohjelma

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kokoa Python-ympäristö ja sovellus
        shell: pwsh
        run: ./installer/rakenna.ps1

      - name: Savutesti
        shell: pwsh
        run: ./build/python/python.exe installer/savutesti.py

      # PyTorch-polku (prosessorilla) ja kuvien käsittely Windowsissa; erillinen Python,
      # joten asennuspakettiin ei tule mitään ylimääräistä
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyTorch- ja kuvatesti
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow pillow-heif torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          python installer/torchtesti.py
          if ($LASTEXITCODE -ne 0) { throw "torchtesti epäonnistui" }

      - name: Rakenna Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DVersio=$env:VERSIO" installer/pixeliremaster.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC epäonnistui" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PixeliRemaster-${{ env.VERSIO }}-Setup
          path: dist/*.exe

      - name: Julkaise
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: installer/julkaisutiedot.md
